services:
  backend:
    image: ghcr.io/bedro0/sar-backend:latest
    build:
      context: ./backend
    expose:
      - "8000"
    volumes:
      - "${MUSIC_PATH}:/radiosa/music:ro"
    environment:
      HOSTNAME: "localhost"
      DISPLAY_ADMIN: "admin"
      ADMIN_USER: "admin"
      ENABLED_STATIONS: "bouncefm, csr, kdst, kjah, krose, mastersounds, playbackfm, radiols, radiox, sfur, wctr"
      ICECAST_ADMIN_PASS: ""
      ICECAST_RELAY_PASS: ""
      ICECAST_SOURCE_PASS: ""

  frontend:
    image: ghcr.io/bedro0/sar-frontend:latest
    build:
      context: ./frontend
    ports:
      - "4321:4321"
    volumes:
      - "${MUSIC_PATH}:/radiosa/music:ro"
    depends_on:
      - backend
